name: Release

# v로 시작하는 태그(예: v0.9.0)를 푸시하면 macOS 앱을 빌드해 GitHub Release에 올림.
# 수동 실행(workflow_dispatch)은 릴리스를 만들지 않고 빌드 결과만 아티팩트로 남김 (시험용).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS 앱 빌드·릴리스 (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 태그와 앱 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/version.py --check "$GITHUB_REF_NAME"

      # 엔진 빌드·스모크 테스트 → 엔진 서명 → 앱·dmg·업데이트 파일 생성
      - name: 앱 빌드
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: packaging/macos/release.sh

      - name: 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$VERSION" > notes.md
          cat packaging/release-install-note.md >> notes.md
          gh release create "$GITHUB_REF_NAME" packaging/build/release/* \
            --title "GeoStat $VERSION" --notes-file notes.md --verify-tag

      - name: 빌드 결과 보관 (수동 실행)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: geostat-macos
          path: packaging/build/release/
          retention-days: 7
