<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 330" role="img" aria-label="LM 검정으로 모형을 고르는 흐름(Anselin 2005). OLS를 적합해 LM-lag와 LM-error를 보고, 둘 다 유의하면 Robust LM으로 가름. Robust LM이 둘 다 유의하거나 둘 다 유의하지 않으면 한쪽으로 정하기 어려움. 둘 다 유의하지 않으면 OLS에 머묾. 이 흐름은 공간시차와 공간오차 둘 중 하나를 고르는 출발점일 뿐, 다른 모형(26강)을 배제하지 않음">
<style>
.gsfig{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.gsfig .s-fg{stroke:#1c2330}.gsfig .s-mu{stroke:#8a93a3}.gsfig .s-ac{stroke:#2563eb}.gsfig .s-bd{stroke:#c2410c}.gsfig .s-ok{stroke:#15803d}.gsfig .s-bg{stroke:#ffffff}
.gsfig .f-fg{fill:#1c2330}.gsfig .f-mu{fill:#5a6475}.gsfig .f-ac{fill:#2563eb}.gsfig .f-acs{fill:#e6eefe}.gsfig .f-bd{fill:#c2410c}
.gsfig .f-bds{fill:#fdeee6}.gsfig .f-ok{fill:#15803d}.gsfig .f-sf{fill:#f0f2f5}.gsfig .f-bg{fill:#ffffff}
.gsfig .d0{fill:#2166ac}.gsfig .d1{fill:#67a9cf}.gsfig .d2{fill:#d1e5f0}.gsfig .d3{fill:#fddbc7}.gsfig .d4{fill:#ef8a62}.gsfig .d5{fill:#b2182b}
.gsfig .q0{fill:#fff1e0}.gsfig .q1{fill:#fdc98f}.gsfig .q2{fill:#f98f45}.gsfig .q3{fill:#d9530f}.gsfig .q4{fill:#8c2d04}
@media (prefers-color-scheme:dark){
.gsfig .s-fg{stroke:#e6e9ef}.gsfig .s-mu{stroke:#737c8c}.gsfig .s-ac{stroke:#6d9bff}.gsfig .s-bd{stroke:#fb8b5b}.gsfig .s-ok{stroke:#4ade80}.gsfig .s-bg{stroke:#1a1e26}
.gsfig .f-fg{fill:#e6e9ef}.gsfig .f-mu{fill:#a7afbd}.gsfig .f-ac{fill:#6d9bff}.gsfig .f-acs{fill:#1f2b45}.gsfig .f-bd{fill:#fb8b5b}
.gsfig .f-bds{fill:#3a2218}.gsfig .f-ok{fill:#4ade80}.gsfig .f-sf{fill:#222733}.gsfig .f-bg{fill:#1a1e26}}
</style>
<rect x="0" y="0" width="720" height="330" class="f-bg"/>
<rect x="230.0" y="13.0" width="260.0" height="34.0" rx="6" class="s-fg f-sf" stroke-width="1.2"/>
<text x="360.0" y="34.0" class="f-fg" font-size="11" text-anchor="middle">OLS 적합, 잔차 진단 (가중치 W)</text>
<rect x="230.0" y="83.0" width="260.0" height="34.0" rx="6" class="s-fg f-sf" stroke-width="1.2"/>
<text x="360.0" y="104.0" class="f-fg" font-size="11" text-anchor="middle">LM-lag와 LM-error</text>
<line x1="360.0" y1="47.0" x2="360.0" y2="83.0" class="s-mu" stroke-width="1.3"/>
<polygon points="360.0,83.0 356.6,75.8 363.4,75.8" class="s-mu f-mu" stroke-width="0.5"/>
<rect x="25.0" y="165.0" width="170.0" height="40.0" rx="6" class="s-mu f-bg" stroke-width="1.2"/>
<text x="110.0" y="181.5" class="f-fg" font-size="11" text-anchor="middle">둘 다 유의하지 않음</text>
<text x="110.0" y="196.5" class="f-fg" font-size="11" text-anchor="middle">→ OLS에 머묾</text>
<rect x="225.0" y="165.0" width="150.0" height="40.0" rx="6" class="s-bd f-bds" stroke-width="1.2"/>
<text x="300.0" y="181.5" class="f-fg" font-size="11" text-anchor="middle">LM-lag만 유의</text>
<text x="300.0" y="196.5" class="f-fg" font-size="11" text-anchor="middle">→ 공간시차 모형</text>
<rect x="395.0" y="165.0" width="150.0" height="40.0" rx="6" class="s-ac f-acs" stroke-width="1.2"/>
<text x="470.0" y="181.5" class="f-fg" font-size="11" text-anchor="middle">LM-error만 유의</text>
<text x="470.0" y="196.5" class="f-fg" font-size="11" text-anchor="middle">→ 공간오차 모형</text>
<rect x="555.0" y="165.0" width="150.0" height="40.0" rx="6" class="s-fg f-sf" stroke-width="1.2"/>
<text x="630.0" y="181.5" class="f-fg" font-size="11" text-anchor="middle">둘 다 유의</text>
<text x="630.0" y="196.5" class="f-fg" font-size="11" text-anchor="middle">→ Robust LM으로</text>
<line x1="360.0" y1="117.0" x2="110.0" y2="163.0" class="s-mu" stroke-width="1.3"/>
<polygon points="110.0,163.0 116.5,158.3 117.7,165.1" class="s-mu f-mu" stroke-width="0.5"/>
<line x1="360.0" y1="117.0" x2="300.0" y2="163.0" class="s-mu" stroke-width="1.3"/>
<polygon points="300.0,163.0 303.7,155.9 307.8,161.3" class="s-mu f-mu" stroke-width="0.5"/>
<line x1="360.0" y1="117.0" x2="470.0" y2="163.0" class="s-mu" stroke-width="1.3"/>
<polygon points="470.0,163.0 462.0,163.4 464.6,157.1" class="s-mu f-mu" stroke-width="0.5"/>
<line x1="360.0" y1="117.0" x2="630.0" y2="163.0" class="s-mu" stroke-width="1.3"/>
<polygon points="630.0,163.0 622.3,165.2 623.4,158.4" class="s-mu f-mu" stroke-width="0.5"/>
<rect x="355.0" y="270.0" width="170.0" height="40.0" rx="6" class="s-bd f-bds" stroke-width="1.2"/>
<text x="440.0" y="286.5" class="f-fg" font-size="11" text-anchor="middle">Robust LM-lag만 유의</text>
<text x="440.0" y="301.5" class="f-fg" font-size="11" text-anchor="middle">→ 공간시차 모형</text>
<rect x="540.0" y="270.0" width="170.0" height="40.0" rx="6" class="s-ac f-acs" stroke-width="1.2"/>
<text x="625.0" y="286.5" class="f-fg" font-size="11" text-anchor="middle">Robust LM-error만 유의</text>
<text x="625.0" y="301.5" class="f-fg" font-size="11" text-anchor="middle">→ 공간오차 모형</text>
<rect x="170.0" y="270.0" width="170.0" height="40.0" rx="6" class="s-fg f-sf" stroke-width="1.2"/>
<text x="255.0" y="286.5" class="f-fg" font-size="11" text-anchor="middle">그 밖의 경우 → 값이 큰</text>
<text x="255.0" y="301.5" class="f-fg" font-size="11" text-anchor="middle">쪽 먼저, 또는 26강</text>
<line x1="630.0" y1="207.0" x2="255.0" y2="268.0" class="s-mu" stroke-width="1.3"/>
<polygon points="255.0,268.0 261.6,263.5 262.7,270.2" class="s-mu f-mu" stroke-width="0.5"/>
<line x1="630.0" y1="207.0" x2="440.0" y2="268.0" class="s-mu" stroke-width="1.3"/>
<polygon points="440.0,268.0 445.8,262.5 447.9,269.0" class="s-mu f-mu" stroke-width="0.5"/>
<line x1="630.0" y1="207.0" x2="625.0" y2="268.0" class="s-mu" stroke-width="1.3"/>
<polygon points="625.0,268.0 622.2,260.5 629.0,261.1" class="s-mu f-mu" stroke-width="0.5"/>
</svg>
