<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 280" role="img" aria-label="모의 실험(실현값 2,000개씩)에서 LM 검정 판단 절차가 고른 모형의 비율. 독립 자료에서는 92%를 OLS로 둠(검정을 여럿 하므로 5%보다 조금 더 자주 잘못 경보함). 의존이 약하면(0.2) 공간시차 과정의 47%, 공간오차 과정의 70%를 놓침. 0.5이면 거의 모두 공간 모형을 고르고, 공간오차 과정의 11%는 공간시차 모형으로 잘못 고름">
