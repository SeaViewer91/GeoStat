<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 250" role="img" aria-label="변수별 대역폭(적응, 이웃 수). 회색 막대는 GWR이 모든 계수에 쓴 하나의 대역폭, 주황 점은 MGWR이 변수마다 고른 대역폭. 왼쪽 Y_변이(원래 식에서 상수와 고령비율의 계수는 어디서나 같고 온도편차만 변함)에서 MGWR은 온도편차에 가장 좁은 대역폭(68)을 주었지만, 변하지 않는 고령비율(83)을 전역(149)까지 넓히지는 못했음. 상수(103)는 변수를 표준화한 모형에서는 실제로 변하는 계수임. 오른쪽 Y_독립(모든 계수가 같음)에서는 세 대역폭이 모두 전역에 가까움">
