<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="모의 실험(실현값 1,000개씩)에서 세 검정이 5% 수준에서 유의하게 나온 비율. 앞의 둘은 계수가 지역마다 다른지(이질성)를, LM-error는 오차가 닮았는지(의존성)를 묻는 검정임. 공간오차·공간시차 과정에서는 이질성이 없는데도 체제 Chow가 자주 유의하고, 매끈한 변이 과정에서는 오차가 독립인데도 LM-error가 자주 유의함">
