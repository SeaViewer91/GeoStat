<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="Ward 계층 군집의 덴드로그램(표준화한 네 변수, 행정동 150개). 아래 끝이 동 하나이고, 위로 갈수록 가장 적게 손해 보는 두 군집을 합침. 세로 길이는 병합 거리 √(2Δ)로, 합칠 때 늘어난 군집 내 제곱합 Δ가 클수록 김. 주황 점선(9.4)에서 자르면 군집 4개가 남음. 맨 위의 병합(24.1)이 특히 길어 덴드로그램만 보면 군집 2개가 가장 뚜렷하고, 군집 4개가 남는 높이 구간(9.2~9.6)은 좁음">
