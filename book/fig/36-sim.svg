<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="참값을 아는 모의 400회(참 출동률을 감마분포에서 뽑고, 실제 동 인구로 건수를 만듦). 왼쪽: 인구 4분위별 평균제곱오차. 인구가 적을수록 원비율의 오차가 크고, EB와 완전 베이즈가 크게 줄임. 오른쪽: 95% 구간이 참값을 포함한 비율. 원비율(정확 포아송 구간)은 95%를 넘고, EB와 완전 베이즈는 평균으로 95% 가까이 맞음. 그러나 참 비율이 상위 10%인 동만 보면, 인구 1분위에서 EB 72%, 완전 베이즈 75%로 크게 모자람(평균 쪽으로 당겨서)">
