<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 320" role="img" aria-label="교차검증으로 추정한 RMSE(막대)와 시 전체 지도의 실제 RMSE(검은 가로선). 왼쪽: 40곳에 15점씩 모인 집중 표본. 무작위 10겹 교차검증은 실제 오차를 크게 과소평가함(RF 공변량+좌표: 추정 0.71, 실제 1.26). 공간 블록과 완충 LOO가 실제에 더 가까움. 오른쪽: 시 전체에서 단순 무작위로 뽑은 표본. 무작위 10겹이 실제와 비슷하고, 공간 블록·완충 LOO는 대체로 과대평가함">
