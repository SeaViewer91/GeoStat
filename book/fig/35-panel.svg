<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 260" role="img" aria-label="패널 회귀 계수와 95% 신뢰구간(y = 동별 출동률). 왼쪽 고령비율: 합동 OLS는 동 사이의 차이(고령 동은 시원함)에 섞여 작게 나오고, 동 고정효과를 넣은 모형들은 동 안의 변화로 추정해 4배 안팎으로 큼. 오른쪽 폭염일수: 모든 모형이 비슷함(도시 전체가 함께 겪는 연도 변화로 추정되므로). 합동 OLS와 고정효과는 동 군집 강건 표준오차, 공간 패널은 최대우도 표준오차">
