<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 260" role="img" aria-label="연도별 전역 Moran&#x27;s I(퀸 인접, 순열 999회). 파랑은 원비율 출동률, 주황은 인구를 고려한 EB Moran&#x27;s I. 속이 찬 점은 유사 p ≤ 0.05. 원비율의 I는 작은 수의 흔들림 때문에 해마다 −0.03~0.12로 크게 오르내리고 열 해 가운데 다섯 해만 유의하지만, EB Moran&#x27;s I는 여덟 해에서 유의함">
