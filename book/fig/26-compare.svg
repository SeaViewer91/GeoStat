<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="연습용 모의 자료의 세 변수에 여섯 모형을 적합한 AICc(각 변수에서 가장 작은 값과의 차이, 작을수록 좋음). Y_독립은 OLS, Y_시차는 공간시차(SAR), Y_오차는 공간오차(SEM)가 가장 작음. 참 모형을 포함하는 더 큰 모형(예: Y_오차의 SDM·SDEM, Y_시차의 SDM)은 모수가 많아 AICc가 4~6 정도 뒤짐. 차이가 2보다 작은 모형들은 자료로 잘 구별되지 않음">
