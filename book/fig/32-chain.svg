<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 200" role="img" aria-label="한 줄로 이어진 지역 여섯 개(값 1, 8, 2, 9, 2, 7)를 두 묶음으로 나눈 결과. 위: 값만 보는 비공간 군집은 낮은 값(1, 2, 2)과 높은 값(8, 9, 7)으로 나눠 군집 내 제곱합이 2.67이지만, 두 묶음이 서로 엇갈려 흩어짐. 아래: 이웃끼리만 묶는 연결 제약에서는 이어진 구간으로만 나눌 수 있어, 가장 좋은 자르기(지역 1과 2~6)도 군집 내 제곱합이 45.2로 커짐">
