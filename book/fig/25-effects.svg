<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 290" role="img" aria-label="온도편차의 직접·간접·총 효과. 짙은 회색 막대(다크 모드에서는 밝은 회색)는 참값, 파랑은 공간시차 모형(ML), 초록은 공간시차 모형(GM)의 추정값이고, 가는 선은 ML 추정의 95% 구간(모수 분포에서 2,000번 뽑아 계산). 점선은 OLS 계수(2.27)로, 어느 효과와도 맞지 않음. 공간시차 모형의 계수 β(1.48)도 직접 효과와 같지 않음">
