<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="공간가중치 여섯 가지로 적합한 결과(연습용 모의 자료, 참 가중치는 퀸 인접). 왼쪽: Y_시차의 공간시차 모형과 Y_오차의 공간오차 모형의 로그우도(가장 큰 값과의 차이). 두 변수 모두 참 가중치에서 로그우도가 가장 큼. 오른쪽: 추정한 ρ(Y_시차)와 λ(Y_오차). 참값은 둘 다 0.5인데, 가중치에 따라 ρ는 0.43~0.50, λ는 0.44~0.57로 달라짐">
