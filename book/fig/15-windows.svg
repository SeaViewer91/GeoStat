<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 320" role="img" aria-label="스캔 통계의 원형 창. 마루16동의 중심점에서 원을 키우며 가까운 동을 하나씩 묶음(중심점이 원 안에 들어오면 그 동 전체를 넣음). 실선·파선·점선은 동 1개·4개·8개를 묶은 창이고, 점은 동의 중심점임. 창마다 관측 건수와 기대 건수로 로그우도비를 계산하고, 모든 중심과 크기의 창 가운데 가장 큰 것을 고름">
