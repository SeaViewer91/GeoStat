<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 270" role="img" aria-label="모형에 따른 계수와 95% 신뢰구간. 왼쪽 고령비율 계수는 온도편차를 넣으면 음수에서 양수로 바뀌고, 오른쪽 온도편차 계수는 로그밀도를 함께 넣으면(M4) 커지면서 구간도 넓어짐(다중공선성). 강건은 White 표준오차, WLS는 인구 가중">
