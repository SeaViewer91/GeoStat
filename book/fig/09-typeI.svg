<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="서로 아무 관계가 없는 두 변수로 상관 t검정을 할 때 &#x27;유의하다&#x27;는 잘못된 결론이 나오는 비율(α = 0.05). 가로축은 변수가 이웃끼리 닮은 정도(Moran&#x27;s I). 두 변수가 모두 닮았으면 잘못된 결론이 급격히 늘고, 한쪽만 닮았으면 5% 그대로임. 유효 표본 크기로 보정하면 5% 이하로 돌아옴">
