<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 220" role="img" aria-label="AZP를 시작점(시드) 30개로 돌린 결과의 군집 간 / 전체 비(점 하나가 시드 하나, 지역 4개). 시작 지역 배치에 따라 0.35~0.58로 크게 달라짐. 세로선은 같은 자료의 다른 방법(SKATER, Region K-Means, Ward 공간 제약)과 비공간 K-평균의 비. AZP는 지역 안의 모든 쌍의 거리를 줄이는 목적 함수를 써서 이 비를 직접 최대화하지 않음">
