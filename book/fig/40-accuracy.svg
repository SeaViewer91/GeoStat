<svg xmlns="http://www.w3.org/2000/svg" class="gsfig" viewBox="0 0 720 300" role="img" aria-label="왼쪽: 400픽셀로 시 평균 지표온도를 추정할 때의 실제 RMSE(막대)와 순진한 표준오차 s/√400(점). 픽셀이 붙어 있을수록 실제 오차가 커지는데 순진한 표준오차는 작아짐. 20×20 한 덩어리의 400픽셀은 독립 픽셀 1.2개만큼의 정보임. 오른쪽: 고온 픽셀 분류의 정확도. 훈련 구역 안에서 픽셀을 무작위로 나눈 교차검증은 0.955로 실제 지도 정확도(0.887, 점선)를 크게 부풀림. 구역 단위로 나눈 교차검증도 0.937로 여전히 높음(훈련 구역이 시 전체를 대표하지 않음). 시 전체에서 무작위로 뽑은 독립 표본 1,000픽셀(0.888)만 실제와 맞음">
